<!DOCTYPE HTML>
<html>
<head>
    <title>{title}</title>
    <script src="../../_GlobalResources/Js/head.min.js" type="text/javascript"></script>
    <link href="../../_GlobalResources/Css/jquery-ui-1.10.2/apollo/jquery-ui.min.css"
        rel="stylesheet" type="text/css" />
    <link href="../../_BetList/Resources/BetList.less" rel="stylesheet" type="text/css" />
</head>
<body>
    <form id="frmBetList" method="get">
    <div id="page_main">
        <div id="header_main">
            {title}
        </div>
        <div id="content_main">
            <!--Filter-->
            <div id="box_header" class="report">
                <div class="row">
                    <div class="cell">
                        <div class="label">
                            <label>
                                {static:Apollo.Age.Resources.Lang.dateRange}</label>
                        </div>
                        <div class="editor">
                            <input type="text" id="fromDate" name="fromDate" class="datepicker" value="{valueFromDate}"
                                mindate="{valueMinDate}" maxdate="{valueMaxDate}" />
                        </div>
                    </div>
                    <div class="cell">
                        <div class="label">
                            <label>
                               ~</label>
                        </div>
                        <div class="editor">
                            <input type="text" id="toDate" name="toDate" class="datepicker" value="{valueToDate}"
                                mindate="{valueMinDate}" maxdate="{valueMaxDate}" />
                        </div>
                    </div>
                    <!--User-->
                    <div class="cell">
                        <div class="editor">
                            {option-user}
                        </div>
                    </div>
                    <div class="cell">
                        <div class="editor">
                            <input type="text" id="username" name="username" value="{username}" maxlength="50"
                                style="width: 120px;" autocomplete="off" class="ui-autocomplete-input" />
                        </div>
                    </div>
                    <!--/User-->
                </div>
                <div class="row bg-action">
                    <input type="button" class="btn act-submit" id="dSubmit" value="{static:Apollo.Age.Resources.Lang.search}">
                </div>
            </div>
            <!--/Filter-->
            {content}
            <div>
                {PagingControl}</div>
        </div>
        <!--HiddenFields-->
        <input type="hidden" id="ApoRoot" value="{ApoRoot}" />
        <input type="hidden" id="MainShareHolderId" value="{MainShareHolderId}" />
        <input type="hidden" id="MainShareHolderUsername" value="{MainShareHolderUsername}" />
        <input type="hidden" id="type" name="type" value="{pageType}" />
        <!--/HiddenFields-->
    </div>
    </form>
    <script type="text/javascript">
        ApoRes = {
            InvalidDate: '{static:Apollo.Age.Resources.Lang.InvalidDate}',
            DateIsOutOfRange: '{static:Apollo.Age.Resources.Lang.DateIsOutOfRange}'
        };
    </script>
    <script src="../../_GlobalResources/Js/jquery.js" type="text/javascript"></script>
    <script src="../../_GlobalResources/Js/jquery-ui.js" type="text/javascript"></script>
    <script src="../../_GlobalResources/Js/BlockUI/jquery.blockUI.js" type="text/javascript"></script>
    <script src="../../_GlobalResources/Js/Core.js" type="text/javascript"></script>
    <script src="../../_BetList/Resources/BetList.js" type="text/javascript"></script>
</body>
</html>
