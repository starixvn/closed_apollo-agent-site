<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>{static:Resources.Lang.Exchange_Rate}</title>
    <link href="../../_GlobalResources/Css/Agent.css" rel="stylesheet" type="text/css" />
    <link href="../Resources/Reports.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <form id="frmmain" method="get" {actionForm}>
    <div id="page_main">
        <div id="header_main" style="width:740px;">
            <span style="float:left">{static:Resources.Lang.Exchange_Rate}</span>
        </div>
    </div>
    <!--ExcelContents-->
    <table class="tblRpt" cellpadding="0" cellspacing="1" id="tbl-rpt">
        <tr id="rowTitle" class="RptTitle">
            <td id="content_title" colspan="10">
                memberwinloss
            </td>
        </tr>
        <tr class="RptHeader">
            <td>
                Currency
            </td>
            <td>
                BaseRate
            </td>
            <td>
                MinBet
            </td>
            <td>
                MinBetLive
            </td>
            <td>
                Description
            </td>
            <td>
                Edit
            </td>
        </tr>
        <!--Content-->
        <tr bgcolor="{ColorClass}" onmouseover="" onmouseout="this.style.backgroundColor='{ColorClass}'">
            <td>
                {Currency}
            </td>
            <td>
                {BaseRate}
            </td>
            <td>
                {MinBet}
            </td>
            <td>
                {MinBetLive}
            </td>
            <td>
                {Description}
            </td>
        </tr>
        <!--/Content-->
    </table>
    <!--/ExcelContents-->
    </form>

    <script src="../../_GlobalResources/Js/Core.js" type="text/javascript"></script>
    <script src="../Resources/Reports.js" type="text/javascript"></script>
</body>
</html>
