<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>{static:Resources.Lang.Exchange_Rate}</title>
    <link href="../../_GlobalResources/Css/Agent.css" rel="stylesheet" type="text/css" />
    <link href="../Resources/Reports.css" rel="stylesheet" type="text/css" />
    <style type="text/css">
        #content_title {
             background-image: none;
        }
        #content_title .export-excel {
            float: right;
            padding: 4px;
        }
        #content_title .export-excel input[type=image] {
            cursor: pointer;
        }
        #tbl-rpt td {
            padding: 4px;
        }
    </style>
</head>
<body>
    <form id="frmmain" method="get" {actionForm}>
    <div id="page_main">
        <div id="header_main">{static:Resources.Lang.Exchange_Rate}</div>
    </div>
    <!--ExcelContents-->
    <table id="tbl-rpt" class="tblRpt" cellspacing="1">
        <tr id="rowTitle" class="RptTitle">
            <td id="content_title" colspan="6" style="background-image: none">
            <!--ExportExcel-->
                <div class="export-excel">
                    <input src="../../_GlobalResources/Images/excel.gif"
                        title="{static:Resources.Lang.exporttoexcel}"
                        alt="{static:Resources.Lang.exporttoexcel}"
                        type="image" id="exporttoexcel" name="exporttoexcel" />
                </div>
            <!--/ExportExcel-->
            </td>
        </tr>
        <tr class="RptHeader">
            <td>
                Currency
            </td>
            <td>
                BaseRate
            </td>
            <td>
                MinBet
            </td>
            <td>
                MinBetLive
            </td>
            <td>
                Description
            </td>
            <td>
                Edit
            </td>
        </tr>
        <!--Content-->
        <tr bgcolor="{ColorClass}" onmouseover="" onmouseout="this.style.backgroundColor='{ColorClass}'">
            <td>
                {Currency}
            </td>
            <td>
                {BaseRate}
            </td>
            <td>
                {MinBet}
            </td>
            <td>
                {MinBetLive}
            </td>
            <td>
                {Description}
            </td>
            <td>
                
            </td>
        </tr>
        <!--/Content-->
    </table>
    <!--/ExcelContents-->
    </form>

    <script src="../../_GlobalResources/Js/Core.js" type="text/javascript"></script>
    <script src="../Resources/Reports.js" type="text/javascript"></script>
</body>
</html>
