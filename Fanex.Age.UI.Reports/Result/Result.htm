<!DOCTYPE HTML>
<html>
<head>
    <title>{Title}</title>
    <link href="../../_GlobalResources/Css/jquery-ui-1.10.2/apollo/jquery-ui.min.css" rel="stylesheet" type="text/css" />
    <link href="../../_BetList/Resources/BetList.less" rel="stylesheet" type="text/css" />
	<style type="text/css">
		.btn {
		    margin-right: 5px;
		}
		.tblRpt tbody td {
		    border-width: 1px;
		    vertical-align: middle;
		}
		.tblRpt .no_info td {
		    padding: 0;
		}
		#spfdatetext {
		    font-weight: bold;
		}
	</style>
</head>
<body>
    <form id="frmmain" method="get" action="Result.aspx">
    <div id="page_main">
        <!--ResultTitle-->
        <div id="header_main">
            {Title}
        </div>
        <!--/ResultTitle-->
        <div id="content_main">
            <!--HeaderRegion-->
            <div id="box_header" class="clearfix">
                {load:Fanex.Age.UI.Components.DateRangeSelect_Control DateRangeSelect=new Fanex.Age.UI.Components.DateRangeSelect_Control(this,false,DateTime.Today,DateTime.Today)}
                <input type="button" class="btn" id="btResultType"
                    value="{ResultType}" onclick="DisableButton(); Result_ToggleResultType();" />
            </div>
            <!--/HeaderRegion--> 
            <!--SportCriteria--> 
            <table class="box-header">
                <tr>
                    <td>
                        <label>{static:Resources.Lang.sport}</label>
                    </td>
                    <td id="selSport">
                        <select onchange="Result_ChangeSport()" name="ddlSport" id="ddlSport">
                            <!--SportOption-->
                            <option {SelectedOption} value="{SportId}">{SportName}</option>
                            <!--/SportOption-->
                        </select>
                    </td>
                    <td>&nbsp;</td>
                    <td>
                        <label>{static:Resources.Lang.league}</label>
                    </td>
                    <td id="selLeague" name="selLeague">
                        <select onchange="Result_ChangeLeague();" name="ddlLeague" id="ddlLeague"
							style="width: auto">
                            <option value='0' selected='selected'>&mdash;&mdash;&mdash; Show All Leagues &mdash;&mdash;&mdash;</option>
                            <!--LeagueOption-->
                            <option value="{LeagueId}" {SelectedOption}>{LeagueName}</option>
                            <!--/LeagueOption-->
                        </select>
                    </td>
                </tr>
            </table>
            <!--/SportCriteria-->
            <div id="tbl-container">
                <!--ExcelContents-->            
                <!--/ExcelContents-->
            </div>
        </div>        
    </div>
    <input type="hidden" id="is_outright" name="is_outright" value="{IsOutright}" />
    <input type="hidden" id="changeSportType" name="changeSportType" value="0" />
    </form>
    <input type="hidden" id="ApoRoot" value="{ApoRoot}" />
    {load:Fanex.Age.UI.Reports.Scripts_Template scripts = new Fanex.Age.UI.Reports.Scripts_Template()}
</body>
</html>
