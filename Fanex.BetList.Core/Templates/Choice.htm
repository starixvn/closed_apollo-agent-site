<!--ScoreMapIcon-->
<a class="scoremap" href="javascript:OpenScoreMap({matchId},{betTypeId},{liveindicator},{custId})"
    title="{static:Apollo.Age.Resources.BetList.scoreMap}"></a>
<!--/ScoreMapIcon-->
<!--LeagueName-->
<div class="league">
    {leagueName}
</div>
<!--/LeagueName-->
<!--HomeAwayId-->
<div>
    [{homeid}] vs [{awayid}]</div>
    <!--/HomeAwayId-->
<div>
    {homeTeam} <span class="handicap">{handicap}</span> {awayTeam} 
    <!--LiveScore-->
    <span class="red-color"> {liveHomeScore}:{liveAwayScore}</span>
    <!--/LiveScore-->
</div>
<div>
    <!--Score-->
    <span class="game-type-odd"><b>{finalHomeScore}:{finalAwayScore}</b>&nbsp;</span>
    <!--/Score-->
    <span class="red-color">{betTeam}</span> @ <span class="red-color"><b>{odds}</b></span></div>
