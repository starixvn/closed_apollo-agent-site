<!--HiddenBlock-->
<link href="Resources/RaceBook.css" rel="stylesheet" type="text/css" />

<script src="Resources/jquery.min.js" type="text/javascript"></script>

<script src="Resources/RaceBook.js" type="text/javascript"></script>
<!--/HiddenBlock-->
<div id="race-book-positiontaking-header">{title}</div>
<table id="race-book-userinfo">
    <thead>
    </thead>
    <tbody>
        <tr>
            <td colspan="4">
                &nbsp;
            </td>
        </tr>
        <tr>
            <td class="right" width="25%">
                {username-text}
            </td>
            <td class="left" width="25%">
                {username-val}
            </td>
            <td class="right" width="25%">
                {firstname-text}
            </td>
            <td class="left" width="25%">
                {firstname-val}
            </td>
        </tr>
        <tr>
            <td class="right">
                {lastname-text}
            </td>
            <td class="left">
                {lastname-val}
            </td>
            <td class="right">
                {phone-text}
            </td>
            <td class="left">
                {phone-val}
            </td>
        </tr>
        <tr>
            <td class="right">
                {mobile-text}
            </td>
            <td class="left">
                {mobile-val}
            </td>
            <td class="right">
                {fax-text}
            </td>
            <td class="left">
                {fax-val}
            </td>
        </tr>
    </tbody>
</table>
<!--CopyAll-->
<div id="divCopyAll">
    <input type="checkbox" id="chkCopyAll" {disabled-copyall} name="chkCopyAll" onclick="chkCopyAll_OnClick(this,ArrExc);" />&nbsp;{copy-all}
</div>
<!--/CopyAll-->
