<!--ExternalResources-->

<link href="../_BetList/Resources/Paging.less" rel="stylesheet" type="text/css" />
<script src="../_BetList/Resources/Paging.js" type="text/javascript"></script>

<!--/ExternalResources-->

<div id="{id}" class="{pageclass}" pagesize="{pagesize}" currentindex="{currentindex}" rowcount="{rowcount}" pagecount="{pagecount}">
        <!--SelPageSize-->
        <div class="itemperpage">{static:Apollo.Age.Resources.Lang.pagesize} </div>
        {selPageSize}
        <!--/SelPageSize-->
        <input {disabledFirst} id="btnFirst{id}" type="button" onclick="{id}.First()" class="icon pagingFirst" />
        <input {disabledPrev} id="btnPrev{id}" type="button" onclick="{id}.Move(-1)" class="icon pagingPrev" />

        {static:Apollo.Age.Resources.Lang.tpage}
        <input id="txt{id}" type="text" class="pagingCurrent" maxlength="4" size="2" value="{currentindex}" onkeypress="return {id}.DoEnterNumber(event);" onkeydown="{id}.DoEnter(event, '{id}.Go()')" />
        {static:Apollo.Age.Resources.Lang.of} {pagecount}

        <input {disabledNext} id="btnNext{id}" type="button" onclick="{id}.Move(1)" class="icon pagingNext" />
        <input {disabledLast} id="btnLast{id}" type="button" onclick="{id}.Last()" class="icon pagingLast" />

</div>

<script type="text/javascript">
    var {id} = new Paging('{id}');
</script>
