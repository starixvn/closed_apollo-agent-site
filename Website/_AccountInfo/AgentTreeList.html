<head>
    <title>Agent Tree</title>
    <link href="../_AccountInfo/Resources/treeview.css" rel="stylesheet" type="text/css" />
    <link href="../_AccountInfo/Resources/AccountInfo.less" rel="stylesheet" type="text/css" />
</head>
<body class="downlineTreview-bg">
    <ul id="treeview_list" class="tree-sub">
        
    </ul>
</body>
</html>
<script type="text/javascript" src="../_GlobalResources/Js/jquery.js"></script>
<script type="text/javascript" src="../_AccountInfo/Resources/jquery.cookie.js"></script>
<script type="text/javascript" src="../_AccountInfo/Resources/jquery.treeview.js"></script>
<script type="text/javascript" src="../_AccountInfo/Resources/jquery.treeview.async.js"></script>
<script type="text/javascript">
    jQuery(document).ready(function () {
        
        $("#treeview_list").treeview({
            url: parent.parent.parent.window.baseURL + "Account/TreeNodeData",
            link: "<a href='../_AccountInfo/AccountInfo.aspx?IsMember=0&custid={0}&txtUsername={1}' target='menu'> {2} </a>",
            custid: getCustId()
        });

        function getCustId() {
            var url = window.location.href;
            var params = url.split('?')[1];
            return params.split('=')[1];
        }
    });
</script>
