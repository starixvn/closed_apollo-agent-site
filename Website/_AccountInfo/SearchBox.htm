<div id="Bleft_Parent02">
    <div id="left_submenu">
        <div id="left_line02">
            <img height="1" width="1" alt="" src="../_GlobalResources/Images/dot.gif" name="" /></div>
        <div class="Bleft_Sub02">
            <form name="frmAgent" id="frmAgent" method="get" action="" target="menu" style="float:left;">   
                <div id="from_tab">                            
                    <input maxlength="50" id="txtUsername" type="text" onkeydown="onclickUser('{static:Resources.Lang.enterusername}')" onclick="onclickUser('{static:Resources.Lang.enterusername}')" onblur="onblurUser('{static:Resources.Lang.enterusername}')" value="{usernamesearch}" style="width: 78px;" class="{classStyle}" name="txtUsername" />                    
                </div>
                <div id="b_serachL">
                    <a id="lnkSearch" class="imaLink" href="#" onclick="javascript:checkAndSubmitUI();">
                        <img height="18" width="21" alt="Search" title="{static:Resources.Lang.search}" border="0" nowap="nowap" src="../_GlobalResources/Images/icon_search.jpg" />
                    </a>
                 </div>
                 <div class="search-option">
                    <input type="checkbox" name="isMember" {isChecked}/>
                    <label>Member</label>
                 </div>
            </form>
          
            <div class="line_info">
                <img height="9" width="1" alt="" src="../_GlobalResources/Images/dot.gif" name="" />
            </div>
            <!--CustInfo-->
            <table width="100%" cellspacing="0" cellpadding="0" border="0">
                <tbody>
                    <tr>
                        <td class="top-position">
                            <!--{lblCustomerUsername}:-->
                            {lblUsername}:
                        </td>
                        <td align="right" class="text_org">                            
                            {CustomerUsername}
                            <a href="javascript:void(0)" id="treeview-link">
                                <img height="15" width="15" alt="Treeview" src="../_AccountInfo/Resources/Images/treeview.png" title="Treeview"/>
                            </a>
                        </td>
                    </tr>                    
                    <tr>
                        <td colspan="2">
                            <div class="downline-title">Downline List</div>
                            <div class="agent-treeview">
                                <!--<ul id="fileSystemInfos" class="filetree"></ul><br />
                                <div id="fileSystemInfosControl"> </div>-->
                                
                                {TreeViewDownLineFrame}
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
            <!--/CustInfo-->
            
        </div>        
    </div>    
</div>
