
<div class="search-box">
    <form name="frmAgent" id="frmAgent" method="get" action="" target="menu" class="frmSearch">
        <select id="isMember" name="IsMember">
            <option value="0" {IsAgent}>{static:Resources.Lang.lblAgent}</option>
            <option value="1" {IsMember}>{static:Resources.Lang.lblMember}</option>
        </select>
        <input maxlength="50" id="txtUsername" type="text"
            value="{usernamesearch}" name="txtUsername"
            onkeydown="onclickUser('{static:Resources.Lang.enterusername}')"
            onclick="onclickUser('{static:Resources.Lang.enterusername}')"
            onblur="onblurUser('{static:Resources.Lang.enterusername}')" />
        <button type="button" class="btn" onclick="checkAndSubmitUI()">
            <i class="icon-search"></i>
        </button>               
    </form>
    <!--CustInfo-->
    <table class="cust-info">
        <tbody>
            <tr>
                <td class="agent-lbl">
                    {lblUsername}:
                </td>
                <td class="agent-name">
                    {CustomerUsername}
                </td>
            </tr> 
            <tr>
                <td class="parent-lbl">
                    {lblParentname}:
                </td>
                <td class="parent-name">
                    <a href="javascript:;" id="agentDownlineLink" aid="{AgentID}">
                        <img height="16" width="16"
                            src="../_AccountInfo/Resources/Images/icon-view-info.png"
                            title="{static:Resources.Lang.txtShowUpline}"
                            alt="{static:Resources.Lang.txtShowUpline}" />
                        {ParentUsername}
                        <div id="ddl-agents">
                            <ul class="agent-list"></ul>
                        </div>
                    </a>        
                </td>
            </tr>                                     
        </tbody>
    </table>
    <!--/CustInfo-->
</div>

<div class="clearfix">
    <!--ButtonAgentList-->
    <a class="lnk-agent-list" onclick="clearTopMenu(); ClearCurrentLeftMenu();" target="main"
       href="../_MemberInfo/CustomerList/AgentList.aspx?custid={AgentId}&us={AgentName}">
        {static:Resources.Lang.lblAgentList}</a>
    <!--/ButtonAgentList-->

    <!--ButtonMemberList-->
    <a class="lnk-member-list" onclick="clearTopMenu(); ClearCurrentLeftMenu();" target="main"
       href="../_MemberInfo/CustomerList/MemberList.aspx?custid={AgentId}&us={AgentName}">
        {static:Resources.Lang.lblPlayerList}</a>
    <!--/ButtonMemberList-->

    <!--ButtonBetList-->
    <a class="lnk-betlist" onclick="clearTopMenu(); ClearCurrentLeftMenu();" target="main" href="{memberlistlink}">
        {static:Resources.Lang.BetList}</a>
    <!--/ButtonBetList-->
</div>
