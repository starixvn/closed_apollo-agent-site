<!--HiddenBlock-->
<link href="Resources/AccountInfo.css" rel="stylesheet" type="text/css" />
<link href="Resources/styles.css" rel="stylesheet" type="text/css" />
<!--/HiddenBlock-->

<link href="Resources/treeview.css" rel="stylesheet" type="text/css" />

<div id="Bleft_Parent02">
    <div id="left_submenu">
        <div id="left_line02">
            <img height="1" width="1" alt="" src="../_GlobalResources/Images/dot.gif" name="" /></div>
        <div class="Bleft_Sub02">
            <form name="frmAgent" id="frmAgent" method="get" action="" target="menu" style="float:left;">   
                <select class="option-search">
                    <option value="0">Agent</option>
                    <option value="1">Member</option>
                </select>
                <div id="from_tab">                            
                    <input maxlength="50" id="txtUsername" type="text" onkeydown="onclickUser('{static:Resources.Lang.enterusername}')" onclick="onclickUser('{static:Resources.Lang.enterusername}')" onblur="onblurUser('{static:Resources.Lang.enterusername}')" value="{usernamesearch}" style="width: 80px;" class="{classStyle}" name="txtUsername" />                    
                </div>
                <div id="b_serachL">
                    <a id="lnkSearch" class="imaLink" href="#" onclick="javascript:checkAndSubmitUI();">
                        <img height="18" width="21" alt="Search" title="{static:Resources.Lang.search}" border="0" nowap="nowap" src="../_GlobalResources/Images/icon_search.jpg" />
                    </a>
                 </div>                
            </form>
          
            <div class="line_info">
                <img height="9" width="1" alt="" src="../_GlobalResources/Images/dot.gif" name="" />
            </div>
            <!--CustInfo-->
            <table width="100%" cellspacing="0" cellpadding="0" border="0">
                <tbody>
                    <tr>
                        <td class="top-position">
                            {lblUsername}:
                        </td>
                        <td align="right" class="text_org">                            
                            {CustomerUsername}
                        </td>
                    </tr> 
                    <tr>
                        <td class="top-position">
                            {lblParentname}:
                        </td>
                        <td align="right" class="text_org">         
                            {ParentUsername}
                            <a href="javascript:void(0)" id="agentDownlineLink">
                                <img height="15" width="15" alt="Treeview" src="../_AccountInfo/Resources/Images/treeview.png" title="Treeview"/>
                            </a>
                            <input type="hidden" value="{ParentID}" id="parentid-value"/>
                        </td>
                    </tr>
                    <tr id="agent-downline">
                    </tr>                    
                </tbody>
            </table>
            <!--/CustInfo-->
            
        </div>        
    </div>    
</div> 

<!--ButtonAgentList-->
<div id="button_nLeft01"><a class="b_nleft" onclick="clearTopMenu(); ClearCurrentLeftMenu();" target="main" href="{agentlistlink}">{static:Resources.Lang.lblAgentList}</a></div>
<!--/ButtonAgentList-->
<!--ButtonMemberList-->
<div id="button_nLeft02"><a class="b_nleft" onclick="clearTopMenu(); ClearCurrentLeftMenu();" target="main" href="{memberlistlink}">{static:Resources.Lang.lblPlayerList}</a></div>
<!--/ButtonMemberList-->
<!--ButtonBetList-->
<div id="button_nLeft02"><a class="b_nleft" onclick="clearTopMenu(); ClearCurrentLeftMenu();" target="main" href="{memberlistlink}">{static:Resources.Lang.BetList}</a></div>
<!--/ButtonBetList-->

<!--insert jquery and treeview javascript-->
<link href="Resources/treeview.css" rel="stylesheet" type="text/css" />
<script src="../_GlobalResources/Js/Core.js" type="text/javascript"></script>
<script type="text/javascript" src="../_GlobalResources/Js/jquery.js"></script>
<script type="text/javascript" src="Resources/AccountInfo.js"></script>
<script type="text/javascript">
    jQuery(document).ready(function () {
        jQuery("#agentDownlineLink").click(function () {
            var parentID = jQuery("#parentid-value").val();
            bindAgentDownLine(parentID);
        });
    });
</script>
