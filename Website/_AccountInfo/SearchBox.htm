<!--HiddenBlock-->
<link href="Resources/AccountInfo.css" rel="stylesheet" type="text/css" />
<link href="Resources/styles.css" rel="stylesheet" type="text/css" />
<!--/HiddenBlock-->
<link href="Resources/treeview.css" rel="stylesheet" type="text/css" />

<div id="Bleft_Parent02">
    <div id="left_submenu">
        <div id="left_line02">
            <img height="1" width="1" alt="" src="../_GlobalResources/Images/dot.gif" name="" /></div>
        <div class="Bleft_Sub02">
            <form name="frmAgent" id="frmAgent" method="get" action="" target="menu" style="float:left;" class="frmSearch">   
                <select id="isMember" name="IsMember" class="option-search">
                    <option value="0" {IsAgent}>{static:Resources.Lang.lblAgent}</option>
                    <option value="1" {IsMember}>{static:Resources.Lang.lblMember}</option>
                </select>
                <div id="from_tab">                            
                    <input maxlength="50" id="txtUsername" type="text" onkeydown="onclickUser('{static:Resources.Lang.enterusername}')" onclick="onclickUser('{static:Resources.Lang.enterusername}')" onblur="onblurUser('{static:Resources.Lang.enterusername}')" value="{usernamesearch}" style="width: 77px;" class="{classStyle}" name="txtUsername" />                    
                </div>
                <div id="b_serachL">
                    <a id="lnkSearch" class="imaLink" href="#" onclick="javascript:checkAndSubmitUI();">
                        <img height="18" width="21" alt="Search" title="{static:Resources.Lang.search}" border="0" nowap="nowap" src="../_GlobalResources/Images/icon_search.jpg" />
                    </a>
                 </div>                
            </form>          
            <!--CustInfo-->
            <table width="100%" cellspacing="0" cellpadding="0" border="0">
                <tbody>
                    <tr>
                        <td class="top-position">
                            {lblUsername}:
                        </td>
                        <td align="right" class="text_org">                            
                            {CustomerUsername}
                        </td>
                    </tr> 
                    <tr>
                        <td class="top-position">
                            {lblParentname}:
                        </td>
                        <td align="right" class="text_org">         
                            <a href="#">{ParentUsername}</a>
                            <a href="javascript:void(0)" id="agentDownlineLink" class="view-agent-downline" aid="{AgentID}">
                                <img height="16" width="16" alt="{static:Resources.Lang.txtShowUpline}" src="../_AccountInfo/Resources/Images/icon-view-info.png" title="Treeview"/>
                            </a>
                        </td>
                    </tr>                                     
                </tbody>
            </table>
            <!--/CustInfo-->           
        </div>
        <div class="agent-tooltip">
            <div class="agent-downline-list-container" id="agent-downline-list">
                <div class="top"></div>
                <div class="middle">
                    <ul id="agent-downline" class="agent-list">                            
                    </ul>
                </div>
                <div class="bottom"></div>
            </div>
        </div>        
    </div>    
</div> 

<!--ButtonAgentList-->
<div id="button_nLeft01"><a class="b_nleft" onclick="clearTopMenu(); ClearCurrentLeftMenu();" target="main" href="{agentlistlink}">{static:Resources.Lang.lblAgentList}</a></div>
