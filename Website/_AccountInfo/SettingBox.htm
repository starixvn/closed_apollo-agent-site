<!--HiddenBlock-->
<html>
<link href="Resources/AccountInfo.css" rel="stylesheet" type="text/css" />
<link href="Resources/styles.css" rel="stylesheet" type="text/css" />
<body>
<!--/HiddenBlock-->

<div id="Bleft_Parent02">
    <div id="left_submenu"> 
        <div id="left_tab">
            <ul>                
                <li id="custsettings" class="current"><a href="#" onclick="showSection(this.parentNode.id, null);">
                    <span>{static:Resources.Lang.setting}</span></a></li>
                <!--HiddenBlockHeaderTabAgent-->
                <li id="agentsTab"><a href="#" onclick="showSection(this.parentNode.id, {AgentID});">
                    <span>{static:Resources.Lang.lblAgents}</span></a></li>
                <!--/HiddenBlockHeaderTabAgent-->
                <!--HiddenBlockHeaderTabMember-->
                <li id="membersTab"><a href="#" onclick="showSection(this.parentNode.id, {AgentID});">
                    <span>{static:Resources.Lang.lblMembers}</span></a></li>
                <!--/HiddenBlockHeaderTabMember-->
            </ul>
        </div>
        <div id="clear0" />
        <div class="Bleft_Sub02">
            <table id="tbl_custsettings">             
                <tr>
                    <td colspan="2">
                        <div style="position: relative; left: -3px;" class="settingWidth"></div>
                        <div id="overlayBg" class="overlay">
                        </div>
                    </td>
                </tr>                
                {otherSettings}                    
            </table>
            
            <!--HiddenBlockTabAgent-->
            <table id="tbl_agentsTab" class="agent-tab">
                <tr>
                    <td>
                         {TreeViewDownLineFrame} 
                    </td>
                </tr>                
            </table>
            <!--/HiddenBlockTabAgent-->

            <!--HiddenBlockTabMember-->
            <table id="tbl_membersTab" class="member-tab">
                <tr>
                    <td>
                        <ul id="members-list" class="member-tab-list" style="display:none;"> 
                            <li><span class="no-data">{static:Resources.Lang.noInfo}</span></li>                     
                        </ul>
                    </td>
                </tr>                
            </table>
            <!--/HiddenBlockTabMember-->            
        </div>          
    </div>
</div>
<!--HiddenBlock-->
</body>
</html>
<!--/HiddenBlock-->
