
<div id="agent-setting">
    <ul class="tabs">                
        <li id="custsettings" class="current"><a href="#" onclick="showSection(this.parentNode.id, null);">
            <span>{static:Resources.Lang.setting}</span></a></li>
        <!--HiddenBlockHeaderTabAgent-->
        <li id="agentsTab"><a href="#" onclick="showSection(this.parentNode.id, {AgentID});">
            <span>{static:Resources.Lang.lblAgents}</span></a></li>
        <!--/HiddenBlockHeaderTabAgent-->
        <!--HiddenBlockHeaderTabMember-->
        <li id="membersTab"><a href="#" onclick="showSection(this.parentNode.id, {AgentID});">
            <span>{static:Resources.Lang.lblMembers}</span></a></li>
        <!--/HiddenBlockHeaderTabMember-->
    </ul>
    <div class="content">
        <div id="custsettings-content">
            {otherSettings}                    
        </div>
            
        <!--HiddenBlockTabAgent-->
        <table id="agentsTab-content" class="agent-tab">
            <tr>
                <td>
                    <!--TreeViewBlock-->
                    <iframe id='frmDownlineList' name='frmDownlineList'
                        src='../_AccountInfo/AgentTreeList.html?CustId={CustId}'
                        style='width:98%;height: 100%'></iframe>
                    <!--/TreeViewBlock-->
                    <!--NoInfoBlock-->
                    <span class="no-data-agent">{static:Resources.Lang.noInfo}</span>
                    <!--/NoInfoBlock-->

                </td>
            </tr>                
        </table>
        <!--/HiddenBlockTabAgent-->

        <!--HiddenBlockTabMember-->
        <table id="membersTab-content" class="member-tab">
            <tr>
                <td>
                    <div id="iframe-content"></div>
                </td>
            </tr>
        </table>
            
        <!--/HiddenBlockTabMember-->            
    </div>
</div>
