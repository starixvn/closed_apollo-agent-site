<!DOCTYPE HTML>
<html>
<head runat="server">
    <title>{title}</title>
    <link href="../Resources/Engine/Core.less" rel="stylesheet" type="text/css" />
    <link href="../Resources/Engine/CoreOverride.less" rel="stylesheet" type="text/css" />
    <link href="../../../_Components/ErrorMsg/ErrorMsg.less" rel="stylesheet" type="text/css" />
</head>
<body>
    {static:new Fanex.Age.UI.Components.ErrorMsg.ErrorMsg_Template()}
    {headerText}
    <div class="btnLeft">
        <button id="Button1" class="btnMain" onclick="editSetting.SaveSetting();">
            {actionName}</button>
    </div>
    <div id="settingContainer">
        <div id="commissionSettingContainer">
        </div>
        <div id="bettingLimitContainer">
        </div>
        <div id="ptContainer">
        </div>
    </div>
    <div class="btnLeft">
        <button id="btnSubmitFooter" class="btnMain" onclick="editSetting.SaveSetting();">
            {actionName}</button>
    </div>
    <script type="text/javascript">
        var isReloadParent = {isReloadParent};
    </script>
    <script src="../../../_GlobalResources/Js/Core.js" type="text/javascript"></script>
    <script src="../../../_GlobalResources/Js/jx.js" type="text/javascript"></script>
    <script src="../../../_Components/ErrorMsg/ErrorMsg.js" type="text/javascript"></script>
    <script src='../Handlers/GetPositionTakingSetting.ashx?targetCustId={TargetAgentId}&targetRoleId={TargetRoleId}&ugroup={UGroup}'

    <script src='../Handlers/GetCommissionSetting.ashx?targetCustId={TargetAgentId}&targetRoleId={TargetRoleId}&ugroup={UGroup}'

    <script src='../Handlers/Language.ashx' type="text/javascript"></script>
    <script src="../Resources/Engine/Core.js" type="text/javascript"></script>
    <script src="../Resources/Engine/PTSetting.js" type="text/javascript"></script>
    <script src="../Resources/Engine/BetTypeGroup.js" type="text/javascript"></script>
    <script src="../Resources/Engine/BetType.js" type="text/javascript"></script>
    <script src="../Resources/Engine/CommissionSetting.js" type="text/javascript"></script>
    <script src="../Resources/Engine/BettingLimit.js" type="text/javascript"></script>
    <script src="../Resources/EditPositionTaking.js" type="text/javascript"></script>
    <script src="../Resources/EditBetLimit.js" type="text/javascript"></script>
    <script src="../Resources/EditCommission.js" type="text/javascript"></script>
    <script src="../Resources/EditSetting.js" type="text/javascript"></script>
</body>
</html>
