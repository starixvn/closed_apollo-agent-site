<!--calendar-include-->
<link href="../../_GlobalResources/Css/jquery-ui-1.10.2/apollo/jquery-ui.min.css" rel="stylesheet" type="text/css" />
<!--/calendar-include-->
<link rel="StyleSheet" href="../../App_Themes/AgencyV2/message.less" type="text/css">

<div id="page_main">
    <div id="header_main">
        {messagehistory}
    </div>
    <div id="content_main">
        <div id="box_header">
            <div class="date-range">
                <!--DateTimeSearch-->
                <div class="date">
                    <label>{dateText}</label>
                    <input id="{txtDate}" class="{TxtDateCls} input-date" value="{currentDate}" type="text" size="13" name="{txtDate}"/>
                </div>
                <!--/DateTimeSearch-->
                <input type="button" class="btn" style="width:55px" id="dSubmit" value="{submit}" onclick="javascript:showMsg('');" />
            </div>            
        </div>        
        <table class="tblRpt">
            <thead>
                <tr>
                    <td colspan="4" class="tbList">
                        <ul>
                            <li {normalstyle}><a href="javascript:showMsg('normal');"><span>{normaltext}</span></a></li>
                            <li {specialstyle}><span class="line">|</span><a href="javascript:showMsg('special');"><span>{specialtext}</span></a></li>
                            <li {personalstyle}><span class="line">|</span><a href="javascript:showMsg('private');"><span>{personaltext}</span></a></li>
                        </ul>
                    </td>
                </tr>
                <tr class="RptHeader">
                    <td width="20px">{No_Header}</td>
                    <td width="60px">{MessageID_Header}</td>
                    <td width="80px">{PostDate_Header}</td>
                    <td>{Message_Header}</td>
                </tr>
            </thead>
            <tbody>
                <!--MsgContent-->
                <tr bgcolor="{clor-class}" onmouseover="bgColor='{clor-over}'" onmouseout="bgColor='{clor-class}'">
                    <td class="w_order_ms">{No}</td>
                    <td class="c_ms">{MessageID}</td>
                    <td class="bl_time_ms">{PostDate}</td>
                    <td class="message_content">{Message}</td>
                </tr>
                <!--/MsgContent-->
            </tbody>                
        </table>                
    </div>
</div>
<input type="hidden" name="eroMeg" id="eroMeg" value="{invalidDateMessage}">
<input type="hidden" name="msgType" id="msgType" value="{msgType}">

<script src="../../_GlobalResources/Js/jquery.js" type="text/javascript"></script>
<script src="../../_GlobalResources/Js/jquery-ui.js" type="text/javascript"></script>
<script src="../../_GlobalResources/Js/Core.js" type="text/javascript"></script>
<script src="../../Info/Resources/message.js" type="text/javascript"></script>
