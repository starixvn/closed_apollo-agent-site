<!DOCTYPE HTML>
<html>
<head>
    <title>Footer</title>
    <style type="text/css">
        html, body {
            cursor: default;
            margin: 0;
            padding: 0;
            font-size: 11px;
            color: #333;
        }
        #footer {
            background: url(_GlobalResources/Images/bg_footer.jpg) repeat-x top;
            border-top: 1px solid #999;
            font-family: Arial,sans-serif;
            padding: 5px;
            text-align: right;
        }
    </style>
</head>
<body>
    <div id="footer"></div>
    <script type="text/javascript">
        document.getElementById('footer').innerHTML = 'Copyright &#169; ' + (new Date).getFullYear();
    </script>
</body>
</html>
