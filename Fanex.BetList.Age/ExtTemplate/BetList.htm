<!DOCTYPE html>
<html>
<head>
    <title>Bet List</title>
    <link href="../../../../_GlobalResources/Css/jquery-ui-1.10.2/apollo/jquery-ui.min.css" rel="stylesheet" type="text/css" />
    <link href="../../../../_BetList/Resources/BetList.less" rel="stylesheet" type="text/css" />
</head>
<body>
    <div id="page_main">
        <div id="header_main">
            {title}
            <input type="image" id="exporttoexcel" name="exporttoexcel"
                src="../../../../_GlobalResources/Images/excel.gif"
                alt="{static:Resources.Lang.exporttoexcel}" title="{static:Resources.Lang.exporttoexcel}" />
        </div>
        <div id="content_main">
            <table id="betlist" class="tblRpt">
            {content}
            </table>
            <div id="dialog-details"></div>
        </div>
    </div>

    <script src="../../../../_GlobalResources/Js/jquery-1.9.1.min.js" type="text/javascript"></script>
    <script src="../../../../_GlobalResources/Js/jquery-ui-1.10.2/dialog.min.js" type="text/javascript"></script>
    <script src="../../../../_GlobalResources/Js/Core.js" type="text/javascript"></script>
    <script src="../../../../_Components/AGEWnd/AGEWnd.js" type="text/javascript"></script>
    <script src="../../../../_BetList/Resources/BetList.js" type="text/javascript"></script>
</body>
</html>
